[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapewizard"
version = "1.2.0"
description = "Point it at a page, get the data. Builds a reusable scraper recipe with no AI key; AI help is optional."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ScrapeWizard Team"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0",
    "playwright>=1.40.0",
    "python-json-logger>=2.0.0",
    # Used by the AI-assisted builder's prompts, retries, reports and key storage.
    "inquirerpy>=0.3.4",
    "tenacity>=8.2.0",
    "jinja2>=3.1.0",
    "keyring>=24.0.0",
    "yaspin>=2.0.0"
]

[project.optional-dependencies]
# pip install "scrapewizard[ai]"     -> --ai, --ask and the AI-assisted builder
ai = ["openai>=1.0.0", "anthropic>=0.39.0"]
# pip install "scrapewizard[excel]"  -> --format xlsx
excel = ["pandas>=2.0.0", "openpyxl>=3.1.0"]
# pip install "scrapewizard[dev]"    -> running the test suite
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "fastapi",
    "uvicorn",
    "openai>=1.0.0",
    "anthropic>=0.39.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0"
]

[project.scripts]
scrapewizard = "scrapewizard.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["scrapewizard*", "scrapewizard_runtime*"]

[tool.setuptools.package-data]
scrapewizard = ["engine/*.js", "demo_app/templates/*.html", "report/templates/*", "schemas/*.json"]
